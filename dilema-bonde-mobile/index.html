<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dilema do Bonde — mobile</title>
</head>
<body>
<script>
(async () => {
  const [a,b] = await Promise.all([
    fetch('payload-a.txt').then(r => r.text()),
    fetch('payload-b.txt').then(r => r.text())
  ]);
  const bin = Uint8Array.from(atob(a.trim()+b.trim()), c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.textContent = 'Falha ao carregar: ' + e;
});
</script>
</body>
</html>
