<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 160 240" aria-hidden="true"
               >

  <defs>
    <filter id="shadowCientista" x="-25%" y="-25%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.35" result="blur"/>
      <feOffset in="blur" dx="1.8" dy="2.1" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.07 0 0 0 0 0.12 0 0 0 .28 0" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="peleCientistaMario" cx="44%" cy="28%" r="76%">
      <stop offset="0" stop-color="#ffd9bd"/><stop offset=".58" stop-color="#eba879"/><stop offset="1" stop-color="#b96842"/>
    </radialGradient>
    <linearGradient id="jalecoCientistaMario" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".52" stop-color="#edf3f5"/><stop offset="1" stop-color="#b9c8cf"/>
    </linearGradient>
    <linearGradient id="camisaCientistaMario" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#afbec1"/><stop offset="1" stop-color="#71848a"/>
    </linearGradient>
    <linearGradient id="calcaCientistaMario" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334a67"/><stop offset="1" stop-color="#15263d"/>
    </linearGradient>
    <linearGradient id="mascaraCientistaMario" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7efff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="livroCientistaMario" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#436b3a"/><stop offset="1" stop-color="#17351f"/>
    </linearGradient>
    <linearGradient id="vidroCientistaMario" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#bde9f4" stop-opacity=".58"/>
    </linearGradient>
  </defs>

  <ellipse cx="80" cy="221" rx="38" ry="7" fill="#0f172a" opacity=".13"/>

  <!-- pernas -->
  <g filter="url(#shadowCientista)">
    <path d="M58 163 Q68 159 78 164 L77 213 H59 Z" fill="url(#calcaCientistaMario)"/>
    <path d="M82 164 Q92 159 102 164 L102 213 H83 Z" fill="url(#calcaCientistaMario)"/>
    <ellipse cx="67" cy="214" rx="13" ry="5" fill="#2b211f"/>
    <ellipse cx="94" cy="214" rx="13" ry="5" fill="#2b211f"/>
  </g>

  <!-- tronco e jaleco -->
  <g filter="url(#shadowCientista)">
    <path d="M54 88 Q80 80 106 88 L113 166 Q80 176 47 166 Z" fill="url(#jalecoCientistaMario)" stroke="#9aaab2" stroke-width="1"/>
    <path d="M68 88 H92 L95 151 H65 Z" fill="url(#camisaCientistaMario)"/>
    <path d="M67 87 L55 97 L68 117 L79 91 Z" fill="#f9fcfd" stroke="#c8d4d9" stroke-width=".7"/>
    <path d="M93 87 L105 97 L92 117 L81 91 Z" fill="#e7eef1" stroke="#b8c7ce" stroke-width=".7"/>
    <path d="M80 92 L80 163" stroke="#a7b6bd" stroke-width="1" opacity=".7"/>
    <circle cx="83" cy="126" r="1.6" fill="#8da0a8"/><circle cx="83" cy="143" r="1.6" fill="#8da0a8"/>
    <path d="M91 127 H103 V143 H91" fill="none" stroke="#9cabb2" stroke-width="1"/>
  </g>

  <!-- braço esquerdo e livros -->
  <g filter="url(#shadowCientista)">
    <path d="M54 99 Q38 112 33 139" fill="none" stroke="#dce6e9" stroke-width="14" stroke-linecap="round"/>
    <path d="M33 138 Q34 154 44 164" fill="none" stroke="url(#peleCientistaMario)" stroke-width="9" stroke-linecap="round"/>
    <g transform="rotate(-5 45 147)">
      <rect x="36" y="114" width="13" height="52" rx="2" fill="url(#livroCientistaMario)" stroke="#193321" stroke-width="1"/>
      <rect x="48" y="112" width="13" height="54" rx="2" fill="#244d2e" stroke="#132d1a" stroke-width="1"/>
      <rect x="39" y="116" width="7" height="47" fill="#f7f3e8"/>
      <rect x="51" y="114" width="7" height="49" fill="#fffdf5"/>
      <path d="M46 116 V163 M58 114 V163" stroke="#c8c2b7" stroke-width=".8"/>
    </g>
    <ellipse cx="44" cy="163" rx="7" ry="5.5" fill="url(#peleCientistaMario)" transform="rotate(20 44 163)"/>
  </g>

  <!-- braço direito, erlenmeyer e mão de apoio -->
  <g filter="url(#shadowCientista)">
    <path d="M105 99 Q117 113 122 137" fill="none" stroke="#dce6e9" stroke-width="14" stroke-linecap="round"/>
    <path d="M122 137 Q128 146 139 149" fill="none" stroke="url(#peleCientistaMario)" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(109 94)">
      <path d="M13 0 H25 V15 L41 50 Q43 55 37 57 H1 Q-5 55 -2 50 L14 15 Z" fill="url(#vidroCientistaMario)" stroke="#4f6470" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M2 43 Q19 39 38 43 L41 50 Q43 55 37 57 H1 Q-5 55 -2 50 Z" fill="#22c55e" opacity=".9"/>
      <rect x="12" y="-4" width="15" height="6" rx="2" fill="#d8eef3" stroke="#4f6470" stroke-width="1.2"/>
      <circle cx="12" cy="47" r="2" fill="#a7f3d0" opacity=".85"/>
      <circle cx="24" cy="48" r="1.5" fill="#bbf7d0" opacity=".8"/>
      <path d="M7 20 L1 39" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    </g>
    <path d="M130 150 Q140 156 149 149" fill="none" stroke="url(#peleCientistaMario)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="149" cy="148" r="4.6" fill="url(#peleCientistaMario)"/>
  </g>

  <!-- pescoço -->
  <path d="M69 68 Q80 74 91 68 L92 91 Q80 99 68 91 Z" fill="url(#peleCientistaMario)" filter="url(#shadowCientista)"/>

  <!-- cabeça inspirada no avatar -->
  <g filter="url(#shadowCientista)">
    <ellipse cx="80" cy="47" rx="31" ry="34" fill="url(#peleCientistaMario)"/>
    <ellipse cx="48" cy="50" rx="7" ry="10" fill="url(#peleCientistaMario)"/>
    <ellipse cx="112" cy="50" rx="7" ry="10" fill="url(#peleCientistaMario)"/>
    <path d="M51 31 Q47 40 49 57" fill="none" stroke="#6d4a39" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M109 31 Q113 40 111 57" fill="none" stroke="#6d4a39" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M58 32 Q66 25 75 30 M85 30 Q95 24 103 32" fill="none" stroke="#3b2923" stroke-width="4.2" stroke-linecap="round"/>

    <!-- óculos marcantes -->
    <rect x="53" y="34" width="25" height="22" rx="7" fill="#dff4ff" fill-opacity=".16" stroke="#211b19" stroke-width="4"/>
    <rect x="82" y="34" width="25" height="22" rx="7" fill="#dff4ff" fill-opacity=".16" stroke="#211b19" stroke-width="4"/>
    <path d="M78 41 Q80 39 82 41" fill="none" stroke="#211b19" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M52 39 L47 37 M108 39 L113 37" stroke="#211b19" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="67" cy="45" rx="3.1" ry="4.2" fill="#3b3129"/><ellipse cx="94" cy="45" rx="3.1" ry="4.2" fill="#3b3129"/>
    <circle cx="68" cy="43.5" r="1" fill="#fff"/><circle cx="95" cy="43.5" r="1" fill="#fff"/>
    <path d="M79 45 Q75 55 81 57" fill="none" stroke="#b86d48" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M62 62 Q80 78 99 61 Q92 77 80 79 Q68 77 62 62 Z" fill="#fff" stroke="#9f523f" stroke-width="1.2"/>
    <path d="M69 72 Q80 79 91 71" fill="#d85b55" stroke="none"/>
    <circle cx="101" cy="59" r="1.5" fill="#9b5d48" opacity=".72"/>
  </g>

  <!-- máscara abaixo do queixo, preservando o sorriso -->
  <g filter="url(#shadowCientista)">
    <path d="M57 70 Q80 88 103 70 L99 84 Q80 94 61 84 Z" fill="url(#mascaraCientistaMario)" stroke="#259ac7" stroke-width="1" opacity=".94"/>
    <path d="M57 71 Q51 64 49 53 M103 71 Q109 64 111 53" fill="none" stroke="#dff7ff" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M64 78 Q80 86 96 78" fill="none" stroke="#e5f8ff" stroke-width="1" opacity=".8"/>
  </g>

          </svg>