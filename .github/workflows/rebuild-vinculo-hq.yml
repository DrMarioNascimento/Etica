name: Rebuild vinculo HQ
on:
  push:
    paths:
      - 'dilema-bonde-mobile/assets/.vinculo_chunks/READY'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild high-fidelity SVG
        shell: bash
        run: |
          cat > /tmp/vinculo.svg.gz.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/vinculo.svg.gz.b64 | gzip -d > dilema-bonde-mobile/assets/vinculo.svg
          rm -rf dilema-bonde-mobile/assets/.vinculo_chunks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dilema-bonde-mobile/assets/vinculo.svg dilema-bonde-mobile/assets/.vinculo_chunks
          git commit -m 'Replace vinculo with high-fidelity transparent SVG'
          git push
