name: Rebuild colega HQ raw
on:
  push:
    paths:
      - 'dilema-bonde-mobile/assets/.colega_raw/READY'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild SVG
        shell: bash
        run: |
          cat dilema-bonde-mobile/assets/.colega_raw/part-* > dilema-bonde-mobile/assets/colega.svg
          rm -rf dilema-bonde-mobile/assets/.colega_raw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dilema-bonde-mobile/assets/colega.svg dilema-bonde-mobile/assets/.colega_raw
          git commit -m 'Replace colega with transparent high-quality asset'
          git push
