name: Switch estudante
on:
  push:
    paths:
      - 'dilema-bonde-mobile/assets/.estudante_payload.ready'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch student character asset
        shell: bash
        run: |
          base64 -d dilema-bonde-mobile/assets/.estudante_payload.b64 > dilema-bonde-mobile/assets/estudante.png
          test "$(sha256sum dilema-bonde-mobile/assets/estudante.png | cut -d' ' -f1)" = "92d3624d86432ed2441b2874819c0cbbada93354a29b0a565938122e1147c163"
          python - <<'PY'
          from pathlib import Path
          p = Path('dilema-bonde-mobile/index.html')
          s = p.read_text()
          old = "estudante:      { href: 'assets/estudante.svg',     w: 44, h: 82, ox:  -9, oy: 14 },"
          new = "estudante:      { href: 'assets/estudante.png',     w: 44, h: 82, ox:  -9, oy: 14 },"
          if old not in s:
              raise SystemExit('student config line not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f dilema-bonde-mobile/assets/.estudante_payload.b64 dilema-bonde-mobile/assets/.estudante_payload.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dilema-bonde-mobile/index.html dilema-bonde-mobile/assets/estudante.png dilema-bonde-mobile/assets/.estudante_payload.b64 dilema-bonde-mobile/assets/.estudante_payload.ready
          git commit -m 'Replace estudante character in mobile simulator'
          git push
