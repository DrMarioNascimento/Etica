name: Switch estudante
on:
  push:
    paths:
      - 'dilema-bonde-mobile/assets/.estudante_ready'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace student asset
        shell: bash
        run: |
          base64 -d dilema-bonde-mobile/assets/.estudante_new.b64 > dilema-bonde-mobile/assets/estudante.png
          file dilema-bonde-mobile/assets/estudante.png | grep -q 'PNG image data'
          rm -f dilema-bonde-mobile/assets/.estudante_new.b64 dilema-bonde-mobile/assets/.estudante_ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dilema-bonde-mobile/assets/estudante.png dilema-bonde-mobile/assets/.estudante_new.b64 dilema-bonde-mobile/assets/.estudante_ready
          git commit -m 'Replace student character in mobile simulator'
          git push
